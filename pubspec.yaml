name: plane_mobile
description: Mobile companion app for Plane self-hosted project management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.2.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  path_provider: ^2.1.1
  flutter_slidable: ^4.0.3
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  get_it: ^9.2.1
  dartz: ^0.10.1
  flutter_secure_storage: ^9.2.4
  flutter_widget_from_html: ^0.17.4
  webview_flutter: ^4.14.1
  html: ^0.15.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mermaid/mermaid.min.js
    - assets/mermaid/renderer.js
    - assets/editor/editor.js
    - assets/editor/editor.css
    - assets/editor/LICENSES.txt
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
