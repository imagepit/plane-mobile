name: Deploy Web manually

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Web checksが成功したmainの40桁SHA'
        type: string
        required: true
      preflight_record:
        description: 'CORE-53親コメントに保存した配備前確認のURL'
        type: string
        required: true
      preflight_confirmed:
        description: 'DNS・Access本人限定/未認証/本人以外拒否・Route競合・権限を確認済み'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: plane-mobile-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'imagepit/plane-mobile' && inputs.preflight_confirmed
    environment: plane-mobile-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.sha }}
      PREFLIGHT_RECORD: ${{ inputs.preflight_record }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: 手動入力の形式を確認
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['TARGET_SHA']), '40桁のSHAを指定してください'
          assert re.fullmatch(r'https://plane\.itpit\.net/imagepit/browse/CORE-53/(?:[?#][^\s]*)?', os.environ['PREFLIGHT_RECORD']), '親CORE-53の記録URLを指定してください'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: mainの履歴に含まれるSHAだけを許可
        run: git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: 成功したmain検査の同一成果物を取得
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['TARGET_SHA']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          runs = api(f'actions/workflows/web.yml/runs?branch=main&event=push&status=success&head_sha={sha}&per_page=100')['workflow_runs']
          runs = [r for r in runs if r['head_sha'] == sha and r['head_branch'] == 'main' and r['event'] == 'push' and r['conclusion'] == 'success' and r['head_repository']['full_name'] == repo and r['path'] == '.github/workflows/web.yml']
          assert runs, '指定SHAの成功したmain検査がありません'
          run = runs[0]
          artifacts = api(f"actions/runs/{run['id']}/artifacts?per_page=100")['artifacts']
          artifacts = [a for a in artifacts if a['name'] == f'pwa-{sha}' and not a['expired']]
          assert len(artifacts) == 1, '成果物がないか、一意に決まりません'
          artifact = artifacts[0]
          assert artifact['workflow_run']['head_sha'] == sha and artifact['workflow_run']['head_branch'] == 'main'
          digest = artifact['digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'GitHubのartifact digestがありません'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pwa.zip'
          with archive.open('wb') as output:
              subprocess.run(['gh', 'api', f"repos/{repo}/actions/artifacts/{artifact['id']}/zip"], stdout=output, check=True)
          assert 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest() == digest, 'artifact archiveのdigestが不一致です'
          destination = pathlib.Path('build/pwa')
          assert not destination.exists(), '出力先に既存の成果物があります'
          with zipfile.ZipFile(archive) as bundle:
              members = bundle.infolist()
              assert len(members) <= 20002 and sum(m.file_size for m in members) < 300 * 1024 * 1024
              for member in members:
                  path = pathlib.PurePosixPath(member.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in member.filename
                  assert member.file_size <= 25 * 1024 * 1024
                  assert (member.external_attr >> 16) & 0o170000 != 0o120000, 'symlinkは展開しません'
              bundle.extractall(destination)
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(f"Source SHA: `{sha}`\n\nWeb checks run: {run['html_url']}\n\nArtifact ID: {artifact['id']}\n\nArchive digest: `{digest}`\n\nPreflight: {os.environ['PREFLIGHT_RECORD']}\n")
          PY
      - name: 成果物内のSHAと全ファイルを照合
        run: python3 scripts/package_web.py --verify --sha "$TARGET_SHA"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 再ビルドせず同じ成果物を配備
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:web
